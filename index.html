<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Portal Informativo para Personas Migrantes — Región Huetar Norte</title>
  <meta name="description" content="Información oficial de trámites migratorios, directorios y listas de chequeo con funcionamiento 100% desconectado para San Carlos, Venecia, Upala y Los Chiles.">
  <meta name="theme-color" content="#0284C7">
  
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icons/icon-192.svg">
  <link rel="stylesheet" href="./src/css/styles.css">
</head>
<body>

  <!-- Cabecera Principal -->
  <header>
    <div style="max-width: 800px; margin: 0 auto;">
      <h1>Portal Informativo para Personas Migrantes</h1>
      <p>Región Huetar Norte — Trámites oficiales, requisitos y contactos directos sin intermediarios</p>
      
      <!-- Barra de accesibilidad -->
      <div class="accessibility-bar">
        <button class="btn-acc" onclick="window.toggleFont()">🔍 Ajustar Texto (A/A+)</button>
        <button class="btn-acc" onclick="window.toggleContrast()">🌓 Alto Contraste</button>
      </div>
    </div>
  </header>

  <!-- Indicador de estado de red -->
  <div id="network-status" class="status-bar">
    <span>🟢 Conectado</span>
    <span>Modo PWA Offline Activo</span>
  </div>

  <!-- Contenedor dinámico de vistas -->
  <main class="container">
    <div id="view-container">
      <div style="text-align: center; padding: 40px;">
        <p style="color: var(--text-muted);">Cargando catálogo oficial de trámites...</p>
      </div>
    </div>
  </main>

  <!-- Barra de navegación inferior móvil -->
  <nav class="bottom-nav">
    <a href="#inicio" class="nav-item active" data-view="inicio" onclick="window.appRouter.navigate('inicio')">
      <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      <span>Orientador</span>
    </a>
    <a href="#guias" class="nav-item" data-view="guias" onclick="window.appRouter.navigate('guias')">
      <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
      <span>Guías</span>
    </a>
    <a href="#checklist_global" class="nav-item" data-view="checklist_global" onclick="window.appRouter.navigate('checklist_global')">
      <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
      <span>Requisitos</span>
    </a>
    <a href="#directorio" class="nav-item" data-view="directorio" onclick="window.appRouter.navigate('directorio')">
      <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
      <span>Directorio</span>
    </a>
    <a href="#emergencias" class="nav-item" data-view="emergencias" onclick="window.appRouter.navigate('emergencias')">
      <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
      <span>Emergencias</span>
    </a>
  </nav>

  <script type="module" src="./src/js/app.js"></script>
</body>
</html>
